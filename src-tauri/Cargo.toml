[package]
name = "minke-fm"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "minke_fm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Compiles the Swift half of the player for iOS. The same version `tauri`
# itself uses, so the two link against one copy.
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
# tray-icon: the menu bar item. image-png: decodes the template icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local HTTP server that re-serves the stream to the webview.
tiny_http = "0.12"
# Upstream client. gzip is off: any re-encoding would desync the byte counting
# that ICY metadata depends on.
ureq = { version = "3", default-features = false, features = ["rustls"] }
rand = "0.9"

# Windows and Linux only. A phone has no concept of a second copy, and on macOS
# LaunchServices already brings the running copy forward - while the plugin's
# /tmp socket is denied by the App Store sandbox, so it would do nothing there.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Places the tray panel under the menu bar icon.
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

# The unstripped debug library is 215MB, which makes every Android install take
# minutes. Debugging here is done with logs, not a native debugger.
[profile.dev]
strip = "debuginfo"
